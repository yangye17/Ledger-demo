<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ledger — private preview</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0f1b2d;--ink2:#3a4556;--ink3:#6b7585;--line:#cfd5de;--acc:#0b5d63;--err:#b42318;--btn:#0f1b2d;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d131a;--card:#141c26;--ink:#e7ecf2;--ink2:#b8c2ce;--ink3:#8a95a4;--line:#314055;--acc:#5ec3c8;--err:#f97066;--btn:#e7ecf2;--btnink:#0d131a}}
:root[data-theme="dark"]{--bg:#0d131a;--card:#141c26;--ink:#e7ecf2;--ink2:#b8c2ce;--ink3:#8a95a4;--line:#314055;--acc:#5ec3c8;--err:#f97066;--btn:#e7ecf2;--btnink:#0d131a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;width:100%;max-width:400px}
h1{font-family:Georgia,"Iowan Old Style",serif;font-weight:400;font-size:28px;margin:0}
p{margin:8px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.5}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:22px 0 6px}
input{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
button{margin-top:14px;width:100%;font-size:15px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.rem{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13.5px;color:var(--ink2)}
.rem input{width:auto}
#err{color:var(--err);font-size:13.5px;min-height:20px;margin-top:10px}
.foot{font-size:12px;color:var(--ink3);margin-top:18px}
</style></head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Ledger</h1>
  <p>Private preview. Enter the password you were given.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <div class="rem"><input type="checkbox" id="rem"><label for="rem" style="margin:0;font-weight:400">Remember on this device</label></div>
  <button id="go" type="submit">Open</button>
  <div id="err" role="alert"></div>
  <p class="foot">The page is encrypted. Without the password, its contents can't be read.</p>
</form>

var KEY="ledger-preview-key";
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function open_(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},key,u8(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();
  var pw=document.getElementById("pw").value, btn=document.getElementById("go"), err=document.getElementById("err");
  err.textContent=""; btn.disabled=true; btn.textContent="Opening…";
  try{ var html=await open_(pw);
    try{ if(document.getElementById("rem").checked) localStorage.setItem(KEY,pw); }catch(x){}
    show(html);
  }catch(x){ err.textContent="That password didn't work. Check it and try again."; btn.disabled=false; btn.textContent="Open"; }
});
(async function(){ var s=null; try{ s=localStorage.getItem(KEY); }catch(x){}
  if(s){ try{ show(await open_(s)); }catch(x){ try{localStorage.removeItem(KEY);}catch(y){} } } })();
</script>
